<!DOCTYPE html>
<html lang="en-AU">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trailforks Trails Map - MTB Western Australia</title>
    <link rel="stylesheet" href="../../components/styles.css">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            /* Prevents double scrollbars */
        }

        .full-page-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 60px);
            /* Account for header */
            background-color: var(--theme-bg-primary);
            font-family: Arial, sans-serif;
            width: 100%;
        }

        .TrailforksWidgetMap {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>

<body>
    <div id="navigation-placeholder"></div>
    <script src="../../components/navigation.js"></script>

    <div class="full-page-container">
        <!-- TRAILFORKS WIDGET START -->
        <div class="TrailforksWidgetMap" data-w="100%" data-h="100%" data-rid="3458" data-activitytype="1"
            data-maptype="trailforks" data-trailstyle="difficulty" data-controls="1" data-list="0" data-dml="1"
            data-layers="labels,poi,polygon,directory,region" data-z="" data-lat="" data-lon=""
            data-hideunsanctioned="0" data-basicmap="0"></div>

        <script type="text/javascript">
            var script = document.createElement("script"); script.setAttribute("src", "https://es.pinkbike.org/ttl-86400/sprt/j/trailforks/widget.js"); document.getElementsByTagName("head")[0].appendChild(script); var widgetCheck = false;
        </script>
        <!-- TRAILFORKS WIDGET END -->
    </div>

    <!-- Footer Component -->
    <div id="footer-placeholder"></div>
    <script src="../../components/footer.js"></script>
</body>

</html>
