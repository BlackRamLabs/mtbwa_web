<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trails WA Trails Map - MTB Western Australia</title>
    <link rel="stylesheet" href="../../components/styles.css">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            /* Prevents double scrollbars */
        }
        
        .full-page-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 60px); /* Account for header */
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            width: 100%;
        }
        
        .trails-wa-iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
            border-radius: 0;
        }
    </style>
</head>
<body>
    <div id="navigation-placeholder"></div>
    <script src="../../components/navigation.js"></script>
    
    <div class="full-page-container">
        <!-- TRAILS WA IFRAME START -->
        <iframe 
            src="https://trailswa.com.au/trails/explore?sortBy=highest-rated&trailType%5B0%5D=mountain-bike"
            class="trails-wa-iframe"
            title="Trails WA Mountain Bike Trails Map">
        </iframe>
        <!-- TRAILS WA IFRAME END -->
    </div>
</body>
</html>
